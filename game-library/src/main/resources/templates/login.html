<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Вход</h1>

<p th:if="${error}" class="error" th:text="${error}"></p>
<p th:if="${param.logout}" class="success">Вы вышли из системы</p>
<p th:if="${param.registered}" class="success">Регистрация успешна! Войдите.</p>

<form method="post" action="/login">
    <label>Логин: <input type="text" name="login" required></label><br><br>
    <label>Пароль: <input type="password" name="password" required></label><br><br>
    <button type="submit">Войти</button>
</form>

<p><a href="/register">Нет аккаунта? Зарегистрироваться</a></p>
</body>
</html>
