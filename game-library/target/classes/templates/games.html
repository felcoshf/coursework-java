<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя библиотека игр</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Библиотека игр</h1>

<div class="topbar">
    <span>Пользователь: <b th:text="${login}"></b></span>
    <form method="post" action="/logout" style="display:inline">
        <button type="submit">Выйти</button>
    </form>
</div>

<h3>Фильтр по платформе</h3>
<form method="get" action="/games">
    <select name="platform">
        <option value="">Все платформы</option>
        <option th:each="p : ${platforms}"
                th:value="${p}"
                th:text="${p}"
                th:selected="${p == selectedPlatform}"></option>
    </select>
    <button type="submit">Применить</button>
    <a th:href="@{/games}">Сбросить</a>
</form>

<p><a th:href="@{/games/add}"><button>➕ Добавить игру</button></a></p>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Название</th>
        <th>Платформа</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="g : ${games}">
        <td th:text="${g.title}"></td>
        <td th:text="${g.platform}"></td>
        <td th:text="${g.status}"></td>
        <td>
            <a th:href="@{/games/edit/{id}(id=${g.id})}">Редактировать</a>
            &nbsp;|&nbsp;
            <form method="post"
                  th:action="@{/games/delete/{id}(id=${g.id})}"
                  style="display:inline"
                  onsubmit="return confirm('Удалить игру?')">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(games)}">
        <td colspan="4">Игр пока нет</td>
    </tr>
    </tbody>
</table>
</body>
</html>
